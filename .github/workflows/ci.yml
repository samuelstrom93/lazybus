name: CI

# The same checks as the pre-push hook, plus a one-iteration benchmark run
# (catches benchmarks that no longer compile or fail their assertions) and
# the pre-push hook's own test. Releases are .github/workflows/release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Build
        run: go build ./...

      - name: Benchmark smoke run
        run: go test -run '^$' -bench . -benchtime 1x ./internal/ui

      - name: Pre-push hook test
        run: scripts/test-pre-push.sh
