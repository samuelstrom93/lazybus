name: Release

# A release ships on a version tag, never on a push to main: scripts/release.sh
# pushes an annotated vX.Y.Z tag on the tip of origin/main. The benchmark gate
# only compares the snapshot committed for the tag with the previous stable
# one; measuring happens on framen before tagging (docs/releasing.md).
# workflow_dispatch is the break-glass path for re-running an existing tag:
# GoReleaser updates that tag's GitHub release and replaces assets that
# already exist (release.replace_existing_artifacts in .goreleaser.yaml),
# keeping the existing release notes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-run, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

# One release at a time; never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve and check the tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${TAG} is not a release version (v1.2.3 or v1.2.3-rc.1)."
            exit 1
          fi
          # A tag can be created on any branch. Releases only ever ship code
          # that has been through main, so refuse a tag that isn't reachable
          # from origin/main. checkout only guarantees the triggering ref, so
          # fetch main into a remote-tracking ref explicitly first.
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::${TAG} (${SHA}) is not on origin/main. Refusing to release."
            exit 1
          fi
          echo "${TAG} (${SHA}) is on origin/main."
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  test:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.guard.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Build
        run: go build ./...

      - name: Benchmark smoke run
        run: go test -run '^$' -bench . -benchtime 1x ./internal/ui

      - name: Pre-push hook test
        run: scripts/test-pre-push.sh

  benchmark-gate:
    needs: guard
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.guard.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the snapshot is committed
        run: |
          if [ ! -f "benchmarks/release/bench-${TAG}.json" ]; then
            echo "::error::benchmarks/release/bench-${TAG}.json is not in ${TAG}. Release with scripts/release.sh, which measures and commits it before tagging."
            exit 1
          fi

      - name: Compare with the previous release
        run: go run ./tools/benchreport compare -version "$TAG" -out bench-report/compare.md -summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report
          path: |
            bench-report/compare.md
            benchmarks/release/bench-${{ needs.guard.outputs.tag }}.json
          if-no-files-found: warn

  release:
    needs: [guard, test, benchmark-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.guard.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Outside dist/: `goreleaser release --clean` wipes dist/ first.
      - name: Download the benchmark report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/benchmark-report

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --release-footer ${{ runner.temp }}/benchmark-report/bench-report/compare.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.guard.outputs.tag }}
